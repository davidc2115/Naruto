# Réglages du projet Gradle pour OpenCompanion.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Support Kotlin intégré à AGP 9 (pas de plugin 'org.jetbrains.kotlin.android' séparé) — nécessite
# KSP >= 2.3.1 (Room utilise KSP), voir gradle/libs.versions.toml et app/build.gradle.kts.
android.builtInKotlin=true

# Nombre d'ABI natifs à empaqueter par défaut lors d'un build "fat APK".
# La CI et les développeurs peuvent surcharger via -PabiFilters=arm64-v8a
opencompanion.defaultAbiFilters=arm64-v8a,armeabi-v7a
