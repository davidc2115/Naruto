name: Build APK

# Cette CI est la vraie vérification du projet : ni le SDK Android ni un GPU Vulkan ne sont
# disponibles dans l'environnement où ce projet a été généré, donc c'est ici — sur les runners
# GitHub, qui fournissent le SDK/NDK Android — que la compilation native (llama.cpp + Vulkan) et
# Kotlin/Compose est réellement validée à chaque push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Cloner le dépôt (avec le sous-module llama.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Vulkan est désactivé en CI (OPENCOMPANION_ENABLE_VULKAN=OFF) → glslc/spirv-headers
      # et le fichier swap ne sont plus nécessaires. Ils sont conservés en commentaire pour
      # référence si on réactive Vulkan un jour sur un runner plus puissant.
      #
      # - name: Ajouter du swap (8 Go)
      #   uses: pierotofy/set-swap-space@master
      #   with:
      #     swap-size-gb: 8
      #
      # - name: Installer les outils hôte Vulkan
      #   run: |
      #     wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
      #     sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
      #     sudo apt-get update -qq && sudo apt-get install -y vulkan-sdk spirv-headers libvulkan-dev

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache configuration/objets CMake natifs
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'external/llama.cpp/**/*.cmake', 'external/llama.cpp/**/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Installer la plateforme et le NDK Android requis
        run: |
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1" > /dev/null


      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Build APK debug (arm64-v8a, CPU-only — Vulkan désactivé en CI)
        # Vulkan est désactivé en CI : ggml-vulkan.cpp + les shaders SPIR-V générés automatiquement
        # (mul_mm.comp.cpp contient toutes les variantes de multiplication matricielle) consomment
        # plus de RAM que ce que le runner GitHub offre (7 Go) → l'OOM killer tue le process sans
        # message d'erreur. Le backend CPU est le filet de sécurité intégré, il est toujours
        # présent dans l'APK et utilisé automatiquement quand Vulkan n'est pas disponible.
        # Pour un build avec Vulkan : ./gradlew assembleDebug -POPENCOMPANION_ENABLE_VULKAN=ON
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          ./gradlew :app:assembleDebug --stacktrace --parallel \
            -PabiFilters=arm64-v8a \
            -POPENCOMPANION_ENABLE_VULKAN=OFF || {
            echo "=== DUMP ALL FILES IN APP/.CXX AND BUILD/INTERMEDIATES ==="
            find app/.cxx app/build/intermediates/cxx -type f -exec echo "--- FILE: {} ---" ';' -exec cat {} ';'
            exit 1
          }

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: opencompanion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Uploader les logs de build natif en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            app/.cxx/**/*.log
            app/build/intermediates/cxx/**/*.log
          if-no-files-found: ignore
          retention-days: 7
