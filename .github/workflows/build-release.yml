name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write  # Nécessaire pour créer des releases

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Release APK
        run: ./gradlew assembleRelease
      
      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # APK is now signed, so it's called app-release.apk (not unsigned)
          mv app/build/outputs/apk/release/app-release.apk "Naruto-AI-Chat-${VERSION}.apk"
      
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: naruto-ai-chat-apk
          path: Naruto-AI-Chat-${{ github.event.inputs.version || github.ref_name }}.apk
          retention-days: 30
      
      - name: Create Release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cat > release_notes.md << 'NOTES'
          ## Naruto AI Chat - Release $VERSION
          
          ### ✨ Features:
          - 🍜 13 personnages (6 Naruto + 7 célébrités)
          - 🔓 Modes SFW et NSFW  
          - 🤖 TinyLlama 1.1B sur Freebox (88.174.155.230:11434)
          - 💯 100% GRATUIT & ILLIMITÉ
          - 🎨 Material Design 3 UI
          
          ### 📱 Installation:
          1. Télécharger l'APK
          2. Installer sur Android 8.0+
          3. Utiliser (déjà configuré pour Freebox!)
          
          ### 🔗 Backend:
          - URL: http://88.174.155.230:11434
          - Modèle: TinyLlama 1.1B
          - Pas de clé API nécessaire
          
          Dattebayo! 🍜
          NOTES
          sed -i "s/\$VERSION/${VERSION}/g" release_notes.md
          gh release create "${VERSION}" \
            --repo ${{ github.repository }} \
            --title "Naruto AI Chat ${VERSION}" \
            --notes-file release_notes.md \
            "Naruto-AI-Chat-${VERSION}.apk"
